<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0; color: #1a1a1a; }
  header { display: flex; justify-content: flex-end; gap: 2px; padding: 8px; }
  .icon-btn { width: 18px; height: 18px; padding: 0; border: 0; background: none; }
  form { padding: 16px; display: grid; gap: 16px; }
  label { display: grid; gap: 4px; font-weight: 600; }
  input[type=text], input[type=password] { height: 44px; padding: 0 12px; border: 1px solid #8a8a8a; border-radius: 6px; }
  .invalid { border-color: #d00 !important; }
  .consent { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
  .primary { height: 48px; border: 0; border-radius: 6px; background: #1847c2; color: #fff; font-weight: 600; }
</style>
</head>
<body>
  <!-- Mobile web sign-up. Shown here in the state after the user pressed "Create account" with a mistyped email. -->
  <header>
    <button class="icon-btn" aria-label="Help"><svg viewBox="0 0 18 18" width="18" height="18"><circle cx="9" cy="9" r="8" fill="none" stroke="#444"/><text x="6" y="13" font-size="11">?</text></svg></button>
    <button class="icon-btn" aria-label="Close"><svg viewBox="0 0 18 18" width="18" height="18"><path d="M4 4l10 10M14 4L4 14" stroke="#444" stroke-width="2"/></svg></button>
  </header>

  <form id="signup" novalidate>
    <h1>Create your account</h1>

    <label>Full name
      <input type="text" name="name" value="Ana Souza">
    </label>

    <label>Email
      <input type="text" name="email" class="invalid" value="ana.souza@exmaple">
    </label>

    <label>Password
      <input type="password" name="password">
    </label>

    <label>Confirm password
      <input type="password" name="password_confirm" onpaste="return false" oncopy="return false">
    </label>

    <label class="consent">
      <input type="checkbox" name="marketing" checked>
      Send me offers and share my details with selected partners
    </label>

    <button class="primary" type="submit">Create account</button>
  </form>

  <script>
    document.getElementById('signup').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = e.target.email;
      if (!/^[^@]+@[^@]+\.[a-z]{2,}$/.test(email.value)) {
        email.classList.add('invalid');   // no message; the red border is the only signal
        return;
      }
      await fetch('/api/signup', { method: 'POST', body: new FormData(e.target) });
      location.href = '/welcome';
    });
  </script>
</body>
</html>
