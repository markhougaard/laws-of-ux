<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, system-ui, sans-serif">
  <title>Checkout — payment step, mobile web, default state, static mock, 1x (1 unit = 1 CSS px)</title>
  <rect width="390" height="844" fill="#ffffff"/>

  <!-- Header: back link, hit area 112x44 -->
  <g id="back">
    <rect x="8" y="12" width="112" height="44" fill="none"/>
    <path d="M24 24l-10 10 10 10" fill="none" stroke="#1847c2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="40" font-size="16" fill="#1847c2">Delivery</text>
  </g>
  <text x="374" y="40" font-size="14" fill="#555555" text-anchor="end">Step 3 of 3</text>
  <!-- progress: 3 of 3 segments filled -->
  <rect x="16" y="64" width="114" height="4" rx="2" fill="#1847c2"/>
  <rect x="138" y="64" width="114" height="4" rx="2" fill="#1847c2"/>
  <rect x="260" y="64" width="114" height="4" rx="2" fill="#1847c2"/>

  <text x="16" y="112" font-size="26" font-weight="700" fill="#1a1a1a">Payment</text>

  <!-- Order summary -->
  <rect x="16" y="128" width="358" height="72" rx="10" fill="#f4f5f7" stroke="#8a8a8a"/>
  <text x="32" y="156" font-size="15" fill="#1a1a1a">2 items · Delivery Tue 10 Nov</text>
  <text x="32" y="182" font-size="15" fill="#555555">Total incl. VAT and delivery</text>
  <text x="358" y="182" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="end">£42.00</text>

  <!-- Card number -->
  <text x="16" y="236" font-size="15" font-weight="600" fill="#1a1a1a">Card number</text>
  <rect x="16" y="246" width="358" height="48" rx="6" fill="#ffffff" stroke="#6b6b6b"/>
  <text x="28" y="276" font-size="16" fill="#6b6b6b">1234 1234 1234 1234</text>

  <!-- Expiry + security code -->
  <text x="16" y="330" font-size="15" font-weight="600" fill="#1a1a1a">Expiry date</text>
  <text x="16" y="348" font-size="13" fill="#555555">MM / YY</text>
  <rect x="16" y="356" width="171" height="48" rx="6" fill="#ffffff" stroke="#6b6b6b"/>
  <text x="203" y="330" font-size="15" font-weight="600" fill="#1a1a1a">Security code</text>
  <text x="203" y="348" font-size="13" fill="#555555">3 digits on the back</text>
  <rect x="203" y="356" width="171" height="48" rx="6" fill="#ffffff" stroke="#6b6b6b"/>

  <!-- Name on card -->
  <text x="16" y="440" font-size="15" font-weight="600" fill="#1a1a1a">Name on card</text>
  <rect x="16" y="450" width="358" height="48" rx="6" fill="#ffffff" stroke="#6b6b6b"/>

  <!-- Save card: unticked by default -->
  <rect x="16" y="526" width="24" height="24" rx="4" fill="#ffffff" stroke="#6b6b6b" stroke-width="2"/>
  <text x="52" y="544" font-size="15" fill="#1a1a1a">Save this card for next time</text>

  <!-- Primary action -->
  <rect x="16" y="592" width="358" height="52" rx="8" fill="#1847c2"/>
  <text x="195" y="624" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Pay £42.00</text>
  <text x="195" y="672" font-size="13" fill="#555555" text-anchor="middle">You won't be charged until you press Pay.</text>
</svg>
